name: stale evidence demo

# A live demonstration of the central behaviour: a proof established at one
# revision is not carried to another, and the run names the file that moved.
# Manual on purpose: it deliberately breaks its own artifact, so it never runs
# on push. Run it with `gh workflow run stale-demo.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      UNI: ${{ github.workspace }}/target/release/uni
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build uni
        run: cargo build --release

      - name: Establish a proof on a green revision
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/demo"
          rm -rf "$d"
          cp -r examples/drift-demo "$d"
          rm -f "$d/README.md"
          cd "$d"
          sha=$(sha256sum src/ledger.rs | cut -d' ' -f1)
          sed -i "s/REPLACED_AT_RUNTIME/$sha/" .uni/config.toml
          git init -q
          git add -A
          git -c user.email=ci@ci -c user.name=ci commit -q -m green
          echo "=== the proof is established on this revision ==="
          "$UNI" verify c.uni

      - name: Deliver a change that moves a watched subject
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/demo"
          # a teammate edits the watched file: the outcome may still hold, but
          # the proof was made on other bytes
          sed -i 's/LIMIT: u32 = 100/LIMIT: u32 = 250/' src/ledger.rs
          echo "=== the same commands run again ==="
          "$UNI" verify c.uni || true

      - name: Fail the check
        run: |
          # A proof that no longer applies must turn the check red. The
          # annotations above say which file moved and what to do; the exit
          # code says "do not merge this until it is proved again".
          exit 1

      - name: Annotate the files that moved
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/demo"
          "$UNI" explain --annotations || true
          {
            echo "### Outcome Assurance"
            echo ""
            echo '```'
            "$UNI" explain || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
