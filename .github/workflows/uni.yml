name: uni
on: [push, pull_request]
jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Verify outcomes
        run: |
          ./target/release/uni verify examples/hello/hello.uni
          ./target/release/uni verify examples/multi/multi.uni
          ./target/release/uni verify examples/booking/booking.uni
      - name: UNI Assurance (PR check view)
        run: ./target/release/uni report >> "$GITHUB_STEP_SUMMARY"
