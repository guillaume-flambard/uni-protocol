name: uni

# Self-hosted on push, hosted on pull_request. The runner lives on the lab VPS;
# a pull request from a fork must never execute code there, so PRs (and the
# macOS/Windows legs, which cannot be self-hosted) stay on GitHub images.
on: [push, pull_request]

concurrency:
  group: uni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The lab runner: 8 native cores, no per-runner minutes, same architecture as
  # the Linux artifacts the release publishes.
  linux-push:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, uni-protocol]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-push-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-push-cargo-
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --lib
      - name: Integration tests
        run: cargo test
      - name: Verify examples (portable and POSIX)
        run: |
          ./target/release/uni verify examples/hello/hello.uni
          ./target/release/uni verify examples/multi/multi.uni
          ./target/release/uni verify examples/booking/booking.uni
          ./target/release/uni verify examples/forbid/forbid.uni
          ./target/release/uni verify examples/python/contract.uni
          ./target/release/uni verify examples/nodejs/contract.uni
          ./target/release/uni verify examples/artifact/artifact.uni
      - name: Trust boundary unchanged
        run: ./target/release/uni doctor
      - name: UNI Assurance (PR check view)
        run: ./target/release/uni report >> "$GITHUB_STEP_SUMMARY"

  # Same body on a GitHub image, for pull requests only.
  linux-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-pr-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-pr-cargo-
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --lib
      - name: Integration tests
        run: cargo test
      - name: Verify examples (portable and POSIX)
        run: |
          ./target/release/uni verify examples/hello/hello.uni
          ./target/release/uni verify examples/multi/multi.uni
          ./target/release/uni verify examples/booking/booking.uni
          ./target/release/uni verify examples/forbid/forbid.uni
          ./target/release/uni verify examples/python/contract.uni
          ./target/release/uni verify examples/nodejs/contract.uni
          ./target/release/uni verify examples/artifact/artifact.uni
      - name: UNI Assurance (PR check view)
        run: ./target/release/uni report >> "$GITHUB_STEP_SUMMARY"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --lib
      - name: Integration tests
        run: cargo test
      - name: Verify portable examples
        run: |
          ./target/release/uni verify examples/hello/hello.uni
          ./target/release/uni verify examples/multi/multi.uni
          ./target/release/uni verify examples/booking/booking.uni

  # The shell verifier drives POSIX commands (true, false, grep, sleep), so the
  # integration suite is excluded on Windows by construction, not by pretence.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --lib

  # The published action, exercised for real: it downloads the release binary
  # for the runner platform. The artifact example runs no runtime at all
  # (file-hash), so this isolates the download-and-run path.
  action-smoke-push:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, uni-protocol]
    steps:
      - uses: actions/checkout@v4
      - name: Verify with the published action
        uses: ./adapters/github
        with:
          contract: examples/artifact/artifact.uni
          version: v0.5.2

  action-smoke-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify with the published action
        uses: ./adapters/github
        with:
          contract: examples/artifact/artifact.uni
          version: v0.5.2
