[workspace]
members = [
  "crates/uni-parser",
  "crates/uni-ir",
  "crates/uni-evidence",
  "crates/uni-verify",
  "crates/uni-decision",
  "crates/uni-cli",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
wait-timeout = "0.2"
